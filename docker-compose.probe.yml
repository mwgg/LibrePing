# PROBE-only node: contribute a vantage point to the network without hosting a
# hub or database. Self-contained — copy it anywhere and run:
#
#   docker compose -f docker-compose.probe.yml up -d
#
# Zero config: it defaults to the public network. To customise (location, your
# own hub, …) put settings in an optional .env (see .env.probe.example).
name: libreping-probe

services:
  probe:
    image: ghcr.io/mwgg/libreping-probe:${LIBREPING_VERSION:-latest}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      HUB_URL: "${HUB_URL:-https://nl.lp.mw.gg}"
    volumes:
      - probedata:/data
    # cap_add: ["NET_RAW"]   # enable for ICMP/traceroute checks

volumes:
  probedata:
