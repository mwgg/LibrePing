# Full HUB node: a publicly-reachable hub + its database + dashboard + a local
# probe. This file is self-contained — copy it anywhere and run:
#
#   docker compose up -d
#
# Dashboard: http://localhost:8081   API: http://localhost:8080
# Settings go in an optional .env next to this file (see .env.example); at
# minimum set PUBLIC_URL for a public hub. Update with:
#   docker compose pull && docker compose up -d
name: libreping

services:
  timescaledb:
    # Pinned (not :latest-pg16) so a pull can't silently change the database
    # engine under a running deployment. Bump deliberately.
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: libreping
      POSTGRES_PASSWORD: libreping
      POSTGRES_DB: libreping
    volumes:
      - tsdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U libreping"]
      interval: 5s
      timeout: 5s
      retries: 10

  hub:
    image: ghcr.io/mwgg/libreping-hub:${LIBREPING_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: "postgres://libreping:libreping@timescaledb:5432/libreping?sslmode=disable"
      # Auto-join the mesh from a live seed directory.
      BOOTSTRAP_SEEDS: "${BOOTSTRAP_SEEDS:-https://nl.lp.mw.gg,https://ca.lp.mw.gg,https://sg.lp.mw.gg}"
    volumes:
      - hubdata:/data
    ports:
      - "8080:8080"   # HTTP API / dashboard backend
      - "4001:4001"   # libp2p mesh (expose publicly to federate with peers)

  web:
    image: ghcr.io/mwgg/libreping-web:${LIBREPING_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      - hub
    ports:
      - "8081:80"

  probe:
    image: ghcr.io/mwgg/libreping-probe:${LIBREPING_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      - hub
    env_file:
      - path: .env
        required: false
    environment:
      HUB_URL: "http://hub:8080"
    volumes:
      - probedata:/data
    # ICMP/traceroute checks need raw sockets. If your host disallows this cap,
    # remove the line — the probe auto-detects and simply won't offer them.
    cap_add: ["NET_RAW"]

volumes:
  tsdata:
  hubdata:
  probedata:
